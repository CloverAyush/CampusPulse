name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Test-only values. The suite builds its own database; nothing here is used
      # outside CI, and the key is not the one this project ever ran with.
      ENVIRONMENT: development
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-000000
      DATABASE_URL: sqlite:///./ci.db
      BCRYPT_ROUNDS: "4"
      LOG_JSON: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: python -m pyflakes app tests scripts alembic

      - name: Check migrations match the models
        # The suite builds its schema by running the migrations, so a model change
        # without a matching migration fails here rather than in production.
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Tests
        run: python -m pytest -q

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --requirement requirements.txt --strict

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src

      - name: Build
        run: npx next build

      - name: Audit dependencies for known vulnerabilities
        run: npm audit --audit-level=high
